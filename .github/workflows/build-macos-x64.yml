name: Build macOS x64 DMG

on:
  push:
    branches: [fix/array-at-polyfill]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: x86_64-apple-darwin

      - name: Ensure Rust target on pinned toolchain
        run: |
          rustup target add x86_64-apple-darwin
          rustup target list --installed
          rustup show active-toolchain

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies and prebuild
        run: |
          pnpm install --frozen-lockfile
          pnpm run prebuild x86_64-apple-darwin

      - name: Disable updater artifacts (no signing key, no auto-update)
        run: |
          jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Tauri build
        run: NODE_OPTIONS=--max-old-space-size=4096 pnpm exec tauri build --target x86_64-apple-darwin

      - name: Collect build outputs (diagnostics)
        if: always()
        run: |
          ls -l target/release/clash-verge 2>/dev/null || true
          ls -l target/x86_64-apple-darwin/release/clash-verge 2>/dev/null || true
          file target/*/release/clash-verge 2>/dev/null || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ClashVerge-${{ github.sha }}-macos-x64
          path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
